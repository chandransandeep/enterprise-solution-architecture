name: Validate architecture documentation
on:
  push:
  pull_request:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_architecture.py
      - run: python -m unittest discover -s tests -v
