name: Civic Talent CI
on:
  push:
    paths:
      - 'civic-talent-platform/**'
      - '.github/workflows/civic-talent-ci.yml'
  pull_request:
    paths:
      - 'civic-talent-platform/**'
      - '.github/workflows/civic-talent-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: civic-talent-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: civic-talent-platform/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker build -t civic-talent:test .
