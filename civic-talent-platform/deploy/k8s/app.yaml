apiVersion: apps/v1
kind: Deployment
metadata: {name: civic-talent-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: civic-talent-api}}
  template:
    metadata: {labels: {app: civic-talent-api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: ghcr.io/REPLACE_ORG/civic-talent-platform:REPLACE_TAG
          ports: [{containerPort: 8000}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: civic-talent-secrets, key: database-url}}
            - name: API_KEY
              valueFrom: {secretKeyRef: {name: civic-talent-secrets, key: api-key}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: civic-talent-api}
spec:
  selector: {app: civic-talent-api}
  ports: [{port: 80, targetPort: 8000}]
